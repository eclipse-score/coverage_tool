name: QNX end-to-end tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # Group runs for each PR event separately so a skipped job cannot cancel
  # the job testing the revision. Give each non-PR run its own group.
  group: qnx-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  qnx_end_to_end_tests:
    # The upstream repository supplies the QNX credentials and approval environment.
    # Pushes, merge groups and manual runs test their event revision.
    # For PRs, both events can fire. Use pull_request for the internal merge
    # revision and pull_request_target for the fork head with approval.
    # The shared workflow rejects a fork on pull_request with an error and
    # would also run an internal PR on pull_request_target against its head.
    if: |-
      github.repository == 'eclipse-score/coverage_tool' && (
        !github.event.pull_request ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_target' &&
         github.event.pull_request.head.repo.full_name != github.repository)
      )
    uses: eclipse-score/cicd-workflows/.github/workflows/bazel.yml@2d1dc93f0edb9f99dbcce4c0065d31d73996f04a # main (2026-11-24)
    with:
      test-targets: //tests/end_to_end/tests:cpp_semantics_qnx_test
      # The outer pytest runs on Linux. Its nested Bazel invocation selects
      # QNX and inherits GH_TOKEN to fetch the private SDK release.
      test-args: --test_env=GH_TOKEN
      setup-qnx-sdp: true
      setup-qemu: true
      qnx-credential-helper: ""
      cache-key: qnx_end_to_end_tests
      artifact-name: qnx-end-to-end-tests-report
      retention-days: 3
    secrets:
      qnx-license: ${{ secrets.SCORE_QNX_LICENSE }}
      qnx-user: ${{ secrets.SCORE_QNX_USER }}
      qnx-password: ${{ secrets.SCORE_QNX_PASSWORD }}
      github-token: ${{ secrets.SCORE_BOT_QNX_PKG_PAT }}
