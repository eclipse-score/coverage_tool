name: Compatibility tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: compatibility-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  consumer:
    name: ${{ matrix.consumer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        consumer: [baselibs, inc_security_crypto, inc_someip_gateway, kyron, lifecycle, logging, persistency, time]
    steps:
      - name: Checkout coverage_tool
        uses: actions/checkout@v7.0.1

      - name: Free disk space
        uses: eclipse-score/more-disk-space@v1
        with:
          level: 4

      - name: Setup Bazel cache
        uses: eclipse-score/cicd-actions/setup-bazel-cache@setup-bazel-cache/v0.1.0
        with:
          disk-cache-key: compatibility-${{ matrix.consumer }}

      - name: Run consumer coverage tests
        run: bazel test //tests/compatibility:consumers --test_arg=-k --test_arg=${{ matrix.consumer }}

      - name: Publish test and coverage summaries
        if: always()
        env:
          RESULTS_DIR: bazel-testlogs/tests/compatibility/consumers/test.outputs/${{ matrix.consumer }}
        run: |
          if [ -f "$RESULTS_DIR/compatibility_summary.md" ]; then
            cat "$RESULTS_DIR/compatibility_summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          REPORT_ARCHIVE="$RESULTS_DIR/coverage-report.zip"
          if [ -f "$REPORT_ARCHIVE" ] && unzip -Z1 "$REPORT_ARCHIVE" | grep -x coverage_summary.md > /dev/null; then
            unzip -p "$REPORT_ARCHIVE" coverage_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.consumer }}-results
          path: |
            bazel-testlogs/tests/compatibility/consumers/test.xml
            bazel-testlogs/tests/compatibility/consumers/test.log
            bazel-testlogs/tests/compatibility/consumers/test.outputs/${{ matrix.consumer }}/
          if-no-files-found: ignore
          retention-days: 3
