name: Tests
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  release:
    types: [published]
  merge_group:
    types: [checks_requested]
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  ANDROID_HOME: ""
  ANDROID_SDK_ROOT: ""
jobs:
  unit_tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Free Disk Space (Ubuntu)
        uses: eclipse-score/more-disk-space@v1
        with:
          level: 4
      - uses: eclipse-score/cicd-actions/setup-bazel-cache@setup-bazel-cache/v0.1.0
        with:
          disk-cache-key: unit_tests
      - name: Build everything
        run: bazel build --lockfile_mode=error //...
      - name: Run unit and Starlark analysis tests
        run: bazel test --lockfile_mode=error //tests/unit/... //tools/...
      - name: Static analysis of the Python (ruff, pylint, ty; findings fail the build)
        run: bazel build --lockfile_mode=error --config=lint //score_coverage/... //tools/... //tests/...
      - name: Measure structural coverage of the tool itself (coverage.py)
        run: bazel coverage --lockfile_mode=error --combined_report=lcov //tests/unit/score_coverage:all
      - name: "Gate structural coverage (ratchet, raise as tests land; target 100/100)"
        run: |
          bazel run --lockfile_mode=error //tools:self_coverage_gate -- \
            --min-lines 95 --min-branches 87 --summary-md "$GITHUB_STEP_SUMMARY"
      - name: Ensure the lockfile is up to date
        run: |
          bazel mod deps --lockfile_mode=update
          git diff --exit-code MODULE.bazel.lock
      - name: Collect JUnit results for the documentation build
        # docs-as-code links testcases to requirements from these files
        # (tests-report/<bazel-testlogs path>/test.xml).
        run: |
          rm -rf tests-report && mkdir -p tests-report/tests/unit
          rsync -amL --include='*/' --include='test.xml' --exclude='*' bazel-testlogs/tests/unit/ tests-report/tests/unit/
          echo "collected $(find tests-report -name test.xml | wc -l) test.xml files"
      - uses: actions/upload-artifact@v4
        with:
          name: unit-tests-report
          path: tests-report
          if-no-files-found: error
          retention-days: 3
  end_to_end_tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Free Disk Space (Ubuntu)
        uses: eclipse-score/more-disk-space@v1
        with:
          level: 4
      - uses: eclipse-score/cicd-actions/setup-bazel-cache@setup-bazel-cache/v0.1.0
        with:
          disk-cache-key: end_to_end_tests
      - name: Run the end-to-end pipeline test (C++ + Rust consumer workspace)
        run: tests/end_to_end/run_end_to_end_test.sh
      - name: Run the end-to-end pytest CLI case
        run: bazel test --lockfile_mode=error //tests/end_to_end/testcases:blackbox_test
      - name: Upload end-to-end pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: end-to-end-tests-report
          # Preserve paths below bazel-testlogs for the docs job's tests-report tree.
          path: bazel-testlogs/**/test.xml
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload coverage report of the end-to-end workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: end_to_end_coverage_report
          path: tests/end_to_end/consumer/coverage_artifacts.zip
          if-no-files-found: ignore
          retention-days: 10
  test_reports:
    needs: [unit_tests, end_to_end_tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Download unit test results
        uses: actions/download-artifact@v4
        with:
          name: unit-tests-report
          path: tests-report
      - name: Download end-to-end test results
        uses: actions/download-artifact@v4
        with:
          name: end-to-end-tests-report
          path: tests-report
      - uses: actions/upload-artifact@v4
        with:
          name: tests-report
          path: tests-report
          if-no-files-found: error
          retention-days: 3
  docs:
    needs: test_reports
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@d2083d5dac0e309643d9f495e61342dfbaf07ed5 # main, 2026-09-24
    permissions:
      contents: read
    with:
      # docs() lives in //docs (the root package must not load dev deps), so
      # move its output to _build, which the reusable workflow uploads.
      bazel-target: "//docs:docs && mv docs/_build _build"
      tests-report-artifact: tests-report
      retention-days: 3
