name: Publish Documentation

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

jobs:
  docs-publish:
    # Only publish runs that produce an addressable documentation version.
    # Merge-group runs are ephemeral and should not update Pages previews.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["pull_request", "push", "release"]'), github.event.workflow_run.event)
    uses: eclipse-score/cicd-workflows/.github/workflows/docs-publish.yml@d2083d5dac0e309643d9f495e61342dfbaf07ed5 # main, 2026-09-24
    with:
      deployment_type: workflow
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
      pull-requests: write
