name: Downstream tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: downstream-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  consumer:
    name: ${{ matrix.consumer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        consumer: [baselibs, lifecycle]
    steps:
      - name: Checkout coverage_tool
        uses: actions/checkout@v7.0.1

      - name: Free disk space
        uses: eclipse-score/more-disk-space@v1
        with:
          level: 4

      - name: Setup Bazel cache
        uses: eclipse-score/cicd-actions/setup-bazel-cache@setup-bazel-cache/v0.1.0
        with:
          disk-cache-key: downstream-${{ matrix.consumer }}

      - name: Run the consumer's coverage workflow
        run: bazel test --lockfile_mode=error --test_env=GITHUB_STEP_SUMMARY //tools/downstream_tests:${{ matrix.consumer }}

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-${{ matrix.consumer }}-results
          path: |
            bazel-testlogs/tools/downstream_tests/${{ matrix.consumer }}/test.xml
            bazel-testlogs/tools/downstream_tests/${{ matrix.consumer }}/test.outputs/coverage-report.zip
          if-no-files-found: ignore
          retention-days: 3
