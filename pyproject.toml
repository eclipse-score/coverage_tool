[tool.ruff]
line-length = 120
target-version = "py311"  # oldest interpreter the module supports (see MODULE.bazel)
extend-exclude = ["__pycache__", ".*", "bazel-*", "integration_tests"]

[tool.ruff.lint]
# Rule set of score_tooling's python_basics/pyproject.toml (S-CORE Python guideline).
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C90", # mccabe complexity
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RET", # flake8-return
]

[tool.ruff.lint.isort]
known-first-party = ["score_coverage"]

[tool.ruff.lint.mccabe]
# The S-CORE complexity requirement (gd_req__impl_complexity_analysis) is
# LoC-based: 100 lines per function for safety-related code. McCabe 15 is this
# module's additional ceiling; ruff's default of 10 is the python_basics style
# preference and would force splitting straightforward validation code.
max-complexity = 15

[tool.ty.environment]
python-version = "3.11"

[tool.pylint.format]
max-line-length = 120
# S-CORE process limit for safety-related code (gd_req__impl_complexity_analysis).
max-module-lines = 2000

[tool.pylint."messages control"]
disable = [
    # Size/complexity is governed by ruff's C901 (max 15, see [tool.ruff.lint.mccabe])
    # and the process LoC limits; pylint's design counters would add a second,
    # unrelated set of thresholds for the same property.
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-nested-blocks",
    "too-many-arguments",
    "too-many-positional-arguments",
    # Small dataclasses and test fakes legitimately have one or no public method.
    "too-few-public-methods",
    # aspect_rules_lint's pylint aspect action (see
    # @aspect_rules_lint//lint:pylint.bzl) only ever passes a target's own
    # `srcs` to pylint -- it never forwards `deps` or sets up PYTHONPATH.
    # Pylint's static import resolution therefore can never see ANY
    # dependency (first-party or third-party) and reports import-error on
    # every non-stdlib import, regardless of whether Bazel actually
    # resolves it fine at build/run time. This is a structural limitation
    # of the sandboxed lint action, not a real code defect, so it can't be
    # fixed in userland code -- disabling is the only option.
    "import-error",

    # These duplicate checks ruff already runs (`[tool.ruff.lint] select`
    # above): verified repo-wide that every finding below was reported by
    # BOTH tools for the exact same file/line. Keeping both just reports the
    # same diagnostic twice with no added signal, so pylint defers to ruff
    # (faster, and already the formatter for this repo).
    "unused-import",  # == ruff F401 (unused-import)
    "undefined-variable",  # == ruff F821 (undefined-name)
    "line-too-long",  # == ruff E501 (line-too-long)
    "multiple-imports",  # == ruff E401 (multiple-imports-on-one-line)
    "reimported",  # == ruff F811 (redefined-while-unused)
    "f-string-without-interpolation",  # == ruff F541 (f-string-missing-placeholders)
]
